<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactics Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Press+Start+2P&family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pitch fills the left, a slim control rail on the right; stacks on phones. Single dark "floodlit stadium" world. */
:root {
  --bg: #0f1612;
  --panel: #18221c;
  --line: #2b3a30;
  --ink: #e9efe9;
  --muted: #93a598;
  --home: #7a1e3c;          /* claret shirt */
  --home-sleeve: #9ccff0;   /* pale blue sleeves */
  --run: var(--home-sleeve);
  --away: #f2c230;
  --home-gk: #3a3d46;       /* goalkeeper kits */
  --away-gk: #e2507f;
  --chalk: rgba(255,255,255,.82);
  --grass-a: #2f7a45;
  --grass-b: #2b7040;
  --font-display: "Oswald", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px;
  display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px;
}
main { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.score { color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
.pitch-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
svg#pitch { width: 100%; height: 100%; max-height: calc(100vh - 110px); touch-action: none; user-select: none; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
aside h2 { font-family: var(--font-display); font-weight: 500; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
select, input[type=text] {
  width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
  padding: 7px 8px; font: inherit;
}
button {
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
  padding: 7px 11px; font: inherit; font-weight: 500; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--home-sleeve); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.team-pill { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }
#editor[hidden] { display: none; }
.roster { display: grid; gap: 3px; font-size: 13px; }
.roster div { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.roster div:hover, .roster div.sel { background: var(--bg); }
.roster .num { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.roster .pos { color: var(--muted); font-size: 11px; }
.player { cursor: grab; }
.player.dragging { cursor: grabbing; }
.player text { pointer-events: none; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 5px; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; height: auto; }
  svg#pitch { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tactics Board</h1>
    <span class="score" id="summary"></span>
  </header>
  <div class="toolbar" role="toolbar" aria-label="Tools">
    <button id="tool-move" aria-pressed="true">Move</button>
    <button id="tool-pass" aria-pressed="false">Pass arrow</button>
    <button id="tool-run" aria-pressed="false">Run arrow</button>
    <button id="undo-arrow">Undo arrow</button>
    <button id="clear-arrows">Clear arrows</button>
    <button id="toggle-away" aria-pressed="true">Show opposition</button>
    <button id="toggle-ball" aria-pressed="true">Show ball</button>
  </div>
  <div class="pitch-wrap">
    <svg id="pitch" viewBox="-4 -4 76 113" aria-label="Football pitch, 68 by 105 metres, your team attacking upwards">
      <defs>
        <pattern id="stripes" width="10.5" height="68" patternUnits="userSpaceOnUse">
          <rect width="5.25" height="68" fill="var(--grass-a)"/>
          <rect x="5.25" width="5.25" height="68" fill="var(--grass-b)"/>
        </pattern>
        <marker id="head-pass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
        <marker id="head-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--run)"/></marker>
      </defs>
      <rect x="-4" y="-4" width="76" height="113" fill="#25613a"/>
      <!-- model coords run along the length (x 0..105); rotate so x=105 is the top goal -->
      <g transform="matrix(0 -1 1 0 0 105)">
      <rect width="105" height="68" fill="url(#stripes)"/>
      <g fill="none" stroke="var(--chalk)" stroke-width=".25">
        <rect width="105" height="68"/>
        <line x1="52.5" y1="0" x2="52.5" y2="68"/>
        <circle cx="52.5" cy="34" r="9.15"/>
        <circle cx="52.5" cy="34" r=".4" fill="var(--chalk)"/>
        <!-- penalty areas 16.5m deep, 40.32m wide -->
        <rect x="0" y="13.84" width="16.5" height="40.32"/>
        <rect x="88.5" y="13.84" width="16.5" height="40.32"/>
        <rect x="0" y="24.84" width="5.5" height="18.32"/>
        <rect x="99.5" y="24.84" width="5.5" height="18.32"/>
        <circle cx="11" cy="34" r=".4" fill="var(--chalk)"/>
        <circle cx="94" cy="34" r=".4" fill="var(--chalk)"/>
        <path d="M16.5 26.69 A9.15 9.15 0 0 1 16.5 41.31"/>
        <path d="M88.5 26.69 A9.15 9.15 0 0 0 88.5 41.31"/>
        <rect x="-2" y="30.34" width="2" height="7.32"/>
        <rect x="105" y="30.34" width="2" height="7.32"/>
        <path d="M0 1 A1 1 0 0 0 1 0 M104 0 A1 1 0 0 0 105 1 M0 67 A1 1 0 0 1 1 68 M104 68 A1 1 0 0 1 105 67"/>
      </g>
      <g id="arrows"></g>
      </g>
      <g id="players"></g>
    </svg>
  </div>
</main>

<aside>
  <section>
    <h2><span class="team-pill" style="background:linear-gradient(90deg,var(--home-sleeve) 0 25%,var(--home) 25% 75%,var(--home-sleeve) 75%)"></span>Your team</h2>
    <div class="row">
      <div><label for="home-formation">Formation</label><select id="home-formation"></select></div>
      <div><label for="home-name">Name</label><input type="text" id="home-name" value="Riverside FC"></div>
    </div>
  </section>
  <section>
    <h2><span class="team-pill" style="background:var(--away)"></span>Opposition</h2>
    <div class="row">
      <div><label for="away-formation">Formation</label><select id="away-formation"></select></div>
      <div><label for="away-name">Name</label><input type="text" id="away-name" value="Opposition"></div>
    </div>
  </section>
  <section id="editor" hidden>
    <h2>Selected player</h2>
    <div class="row">
      <div><label for="ed-num">Number</label><input type="text" id="ed-num" maxlength="2"></div>
      <div><label for="ed-pos">Position</label><input type="text" id="ed-pos" maxlength="4"></div>
    </div>
    <div style="margin-top:8px"><label for="ed-name">Name</label><input type="text" id="ed-name" maxlength="20"></div>
  </section>
  <section>
    <h2>Line-up</h2>
    <div class="roster" id="roster"></div>
  </section>
  <section>
    <h2>Board</h2>
    <div class="toolbar">
      <button id="save">Save</button>
      <button id="load">Load saved</button>
      <button id="copy">Copy line-up</button>
      <button id="reset">Reset</button>
    </div>
  </section>
  <p class="hint">Drag players and the ball. Pick an arrow tool, then drag on the pitch to draw: solid white for passes, dashed for runs. Click a player to rename them.</p>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
// Formations: [pos, x, y] for a team attacking left→right, x 0..105, y 0..68
const FORMATIONS = {
  "4-3-3":   [["GK",5,34],["RB",22,58],["CB",18,42],["CB",18,26],["LB",22,10],["CM",36,46],["DM",31,34],["CM",36,22],["RW",48,58],["ST",50,34],["LW",48,10]],
  "4-4-2":   [["GK",5,34],["RB",22,58],["CB",18,42],["CB",18,26],["LB",22,10],["RM",36,58],["CM",34,40],["CM",34,28],["LM",36,10],["ST",48,40],["ST",48,28]],
  "4-2-3-1": [["GK",5,34],["RB",22,58],["CB",18,42],["CB",18,26],["LB",22,10],["DM",30,41],["DM",30,27],["RW",42,56],["AM",42,34],["LW",42,12],["ST",50,34]],
  "3-5-2":   [["GK",5,34],["CB",18,46],["CB",16,34],["CB",18,22],["RWB",34,60],["CM",33,44],["DM",29,34],["CM",33,24],["LWB",34,8],["ST",48,40],["ST",48,28]],
  "3-4-3":   [["GK",5,34],["CB",18,46],["CB",16,34],["CB",18,22],["RM",34,58],["CM",32,40],["CM",32,28],["LM",34,10],["RW",47,54],["ST",50,34],["LW",47,14]],
  "5-3-2":   [["GK",5,34],["RWB",24,60],["CB",17,46],["CB",15,34],["CB",17,22],["LWB",24,8],["CM",33,46],["CM",31,34],["CM",33,22],["ST",46,40],["ST",46,28]],
  "4-1-4-1": [["GK",5,34],["RB",22,58],["CB",18,42],["CB",18,26],["LB",22,10],["DM",28,34],["RM",38,58],["CM",37,42],["CM",37,26],["LM",38,10],["ST",50,34]],
};
const HOME_NAMES = ["Okafor","Reid","Santos","Kowalski","Mensah","Lindqvist","Duarte","Haddad","Moreau","Tanaka","Byrne"];
const svg = document.getElementById("pitch");
const gPlayers = document.getElementById("players");
const gArrows = document.getElementById("arrows");
const NS = "http://www.w3.org/2000/svg";

let state, tool = "move", selected = null;

function buildTeam(side, formation, names) {
  return FORMATIONS[formation].map(([pos, x, y], i) => ({
    id: side + i, side, pos, num: String(i === 0 ? 1 : i + 1), name: names ? names[i] : "",
    x: side === "home" ? x : 105 - x, y: side === "home" ? y : 68 - y,
  }));
}
function freshState() {
  return {
    home: { name: "Riverside FC", formation: "4-3-3", players: buildTeam("home", "4-3-3", HOME_NAMES) },
    away: { name: "Opposition", formation: "4-4-2", players: buildTeam("away", "4-4-2") },
    ball: { x: 54.5, y: 37 }, arrows: [], showAway: true, showBall: true,
  };
}
function applyFormation(side, formation) {
  const team = state[side];
  const fresh = buildTeam(side, formation);
  team.players = fresh.map((p, i) => ({ ...p, name: team.players[i]?.name || "", num: team.players[i]?.num || p.num }));
  team.formation = formation;
  render();
}

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function toPitch(evt) {
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x: Math.max(-3, Math.min(108, 105 - p.y)), y: Math.max(-3, Math.min(71, p.x)) };
}

// Screen position for a model point: pitch is drawn vertically
const place = o => `translate(${o.y} ${105 - o.x})`;

function render() {
  kitNodes.clear();
  gPlayers.replaceChildren(); gArrows.replaceChildren();
  for (const a of state.arrows) {
    el("line", { x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2,
      stroke: a.type === "pass" ? "#fff" : "var(--run)", "stroke-width": .45,
      "stroke-dasharray": a.type === "run" ? "1.2 .8" : "none", "marker-end": `url(#head-${a.type})`, "stroke-linecap": "round" }, gArrows);
  }
  const teams = state.showAway ? ["away", "home"] : ["home"];
  for (const side of teams) for (const p of state[side].players) drawPlayer(p);
  if (state.showBall) {
    const b = el("g", { class: "player", transform: place(state.ball) }, gPlayers);
    el("circle", { r: 1, fill: "#fff", stroke: "#111", "stroke-width": .2 }, b);
    el("circle", { r: .35, fill: "#111" }, b);
    makeDraggable(b, state.ball);
  }
  renderSide();
}
// Pixel-art shirts, one sprite per facing. K outline, B kit colour, S sleeves, C cuffs,
// T trim (collar, hem), H shine, W badge. West-facing sprites are mirrors of east-facing ones.
const KIT_SPRITES = {
  N: [ // back of the shirt
    ".....KKKKKKKK.....",
    "...KKTTTTTTTTKK...",
    "..KSBBBBBBBBBBSK..",
    ".KSSBBBBBBBBBBSSK.",
    "KSSSBBBBBBBBBBSSSK",
    "KCCSBBBBBBBBBBSCCK",
    "KKKKBBBBBBBBBBKKKK",
    "...KHBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KTTTTTTTTTTK...",
    "...KKKKKKKKKKKK...",
  ],
  NE: [ // back, turned three-quarters to the right: near sleeve full, far sleeve shorter
    "......KKKKKKKK....",
    "....KKTTTTTTTTKK..",
    "...KSBBBBBBBBBSK..",
    "..KSSBBBBBBBBBSSK.",
    ".KSSSBBBBBBBBBSSK.",
    ".KCCSBBBBBBBBBCCK.",
    ".KKKKBBBBBBBBBKKK.",
    "....KHBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KTTTTTTTTTK...",
    "....KKKKKKKKKKK...",
  ],
  E: [ // side on, facing right
    "......KKKKKK......",
    ".....KTTTTTTK.....",
    "....KBBBBBBTTK....",
    "....KBBBKSSSSK....",
    "....KBBBKSSSSSK...",
    "....KBBBBKSSSSK...",
    "....KBBBBKCCCCK...",
    "....KHBBBBKKKKK...",
    "....KBBBBBBBBK....",
    "....KBBBBBBBBK....",
    "....KBBBBBBBBK....",
    "....KBBBBBBBBK....",
    "....KTTTTTTTTK....",
    "....KKKKKKKKKK....",
  ],
  SE: [ // front, turned three-quarters to the right
    "......KKKKKKKK....",
    "....KKTTKKKKTTKK..",
    "...KSBBBBTKKTBSK..",
    "..KSSBBBBBTTBBSSK.",
    ".KSSSBBBBBBBWBSSK.",
    ".KCCSBBBBBBBBBCCK.",
    ".KKKKBBBBBBBBBKKK.",
    "....KHBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KBBBBBBBBBK...",
    "....KTTTTTTTTTK...",
    "....KKKKKKKKKKK...",
  ],
  S: [ // front of the shirt: V-neck and badge
    ".....KKKKKKKK.....",
    "...KKTTKKKKTTKK...",
    "..KSBBBTKKTBBBSK..",
    ".KSSBBBBTTBBBBSSK.",
    "KSSSBBBBBBBWBBSSSK",
    "KCCSBBBBBBBBBBSCCK",
    "KKKKBBBBBBBBBBKKKK",
    "...KHBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KBBBBBBBBBBK...",
    "...KTTTTTTTTTTK...",
    "...KKKKKKKKKKKK...",
  ],
};
const mirror = rows => rows.map(r => [...r].reverse().join(""));
KIT_SPRITES.W = mirror(KIT_SPRITES.E);
KIT_SPRITES.SW = mirror(KIT_SPRITES.SE);
KIT_SPRITES.NW = mirror(KIT_SPRITES.NE);
// Screen directions in 45° steps, clockwise from east (screen y points down)
const DIRS = ["E", "SE", "S", "SW", "W", "NW", "N", "NE"];
// Where the number sits on each sprite: horizontal nudge, baseline, size scale
const NUMBER_SPOT = { N: [0, 1.35, 1], S: [0, 1.5, .9], NE: [.17, 1.4, .92], SE: [.17, 1.5, .85], E: [0, 1.8, .72] };
NUMBER_SPOT.W = NUMBER_SPOT.E;
NUMBER_SPOT.NW = [-.17, 1.4, .92];
NUMBER_SPOT.SW = [-.17, 1.5, .85];

const PX = .34, KIT_W = 18 * PX, KIT_H = 14 * PX;
const ICON_SCALE = .5; // shirts are drawn at half size on the pitch
(function buildKitSymbols() {
  const defs = svg.querySelector("defs");
  // Each layer merges runs of matching pixels into one rect so no seams show between pixels
  const layers = [["BTHW", "currentColor"], ["SC", "var(--sleeve, currentColor)"], ["TC", "rgba(0,0,0,.32)"],
    ["H", "rgba(255,255,255,.45)"], ["W", "#f1e2a6"], ["K", "#14110f"]];
  for (const [dir, art] of Object.entries(KIT_SPRITES)) {
    const sym = el("symbol", { id: "kit-" + dir, viewBox: "0 0 18 14", "shape-rendering": "crispEdges" }, defs);
    for (const [chars, fill] of layers) art.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (!chars.includes(row[x])) continue;
        let w = 1; while (chars.includes(row[x + w])) w++;
        el("rect", { x, y, width: w, height: 1, style: `fill:${fill}` }, sym);
        x += w - 1;
      }
    });
  }
})();

// Which way a player faces: towards the ball, or towards the opposition goal when the ball is hidden
function facing(p) {
  const dx = state.ball.y - p.y, dy = p.x - state.ball.x; // screen offsets of the ball from the player
  if (!state.showBall || Math.hypot(dx, dy) < 1) return p.side === "home" ? "N" : "S";
  const sector = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
  return DIRS[(sector + 8) % 8];
}

const kitNodes = new Map(); // player id → { shadow, kit, num, dir }
function setFacing(p) {
  const n = kitNodes.get(p.id); if (!n) return;
  const dir = facing(p); if (dir === n.dir) return;
  n.dir = dir;
  n.shadow.setAttribute("href", "#kit-" + dir);
  n.kit.setAttribute("href", "#kit-" + dir);
  const [nx, ny, scale] = NUMBER_SPOT[dir];
  n.num.setAttribute("x", nx);
  n.num.setAttribute("y", ny);
  n.num.setAttribute("font-size", (p.num.length > 1 ? 1.45 : 1.75) * scale);
  // The number is printed on the back, so only show it when the back is in view
  n.num.style.display = dir.startsWith("N") ? "" : "none";
}
function updateFacings() { for (const side of ["home", "away"]) state[side].players.forEach(setFacing); }

function drawPlayer(p) {
  const g = el("g", { class: "player", transform: place(p), tabindex: 0, role: "button", "aria-label": `${p.num} ${p.name || p.pos}` }, gPlayers);
  const home = p.side === "home", keeper = p.pos === "GK";
  // Invisible touch target, so the smaller shirts are still easy to grab with a finger
  el("circle", { r: 2.6, fill: "transparent" }, g);
  const icon = el("g", { transform: `scale(${ICON_SCALE})` }, g);
  if (selected === p.id) el("rect", { x: -KIT_W / 2 - .7, y: -KIT_H / 2 - .7, width: KIT_W + 1.4, height: KIT_H + 1.4, fill: "none",
    stroke: "#fff", "stroke-width": .3, "stroke-dasharray": ".6 .4" }, icon);
  const shadow = el("use", { x: -KIT_W / 2 + .45, y: -KIT_H / 2 + .5, width: KIT_W, height: KIT_H, style: "color:#000", opacity: .3 }, icon);
  const kit = el("use", { x: -KIT_W / 2, y: -KIT_H / 2, width: KIT_W, height: KIT_H, style: keeper ? `color:var(--${p.side}-gk)` : `color:var(--${p.side});--sleeve:var(--${p.side}-sleeve, var(--${p.side}))` }, icon);
  const num = el("text", { "text-anchor": "middle", fill: home || keeper ? "#fff" : "#14110f", "font-family": "'Press Start 2P', monospace" }, icon);
  num.textContent = p.num;
  const lt = el("text", { y: KIT_H * ICON_SCALE / 2 + 1.5, "text-anchor": "middle", "font-size": 1.15, fill: "#fff", "font-family": "'Silkscreen', monospace",
    stroke: "rgba(0,0,0,.6)", "stroke-width": .35, "paint-order": "stroke" }, g);
  lt.textContent = (p.name || p.pos).toUpperCase();
  kitNodes.set(p.id, { shadow, kit, num, dir: null });
  setFacing(p);
  makeDraggable(g, p);
  g.addEventListener("keydown", e => { if (e.key === "Enter") select(p.id); });
}

function makeDraggable(g, obj) {
  g.addEventListener("pointerdown", e => {
    if (tool !== "move") return;
    e.stopPropagation(); g.setPointerCapture(e.pointerId); g.classList.add("dragging");
    const start = toPitch(e), ox = obj.x, oy = obj.y; let moved = false;
    const move = ev => {
      const p = toPitch(ev); obj.x = ox + p.x - start.x; obj.y = oy + p.y - start.y;
      if (Math.hypot(p.x - start.x, p.y - start.y) > .4) moved = true;
      g.setAttribute("transform", place(obj));
      if (obj.id) setFacing(obj); else updateFacings(); // a player turns to the ball; moving the ball turns everyone
    };
    const up = () => {
      g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up);
      g.classList.remove("dragging");
      if (!moved && obj.id) select(obj.id); else render();
    };
    g.addEventListener("pointermove", move); g.addEventListener("pointerup", up);
  });
}

// Arrow drawing
let draft = null;
svg.addEventListener("pointerdown", e => {
  if (tool === "move") { if (selected) { selected = null; render(); } return; }
  svg.setPointerCapture(e.pointerId);
  const p = toPitch(e);
  draft = { type: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  draft.node = el("line", { x1: p.x, y1: p.y, x2: p.x, y2: p.y, stroke: tool === "pass" ? "#fff" : "var(--run)", "stroke-width": .45,
    "stroke-dasharray": tool === "run" ? "1.2 .8" : "none", "marker-end": `url(#head-${tool})`, opacity: .7 }, gArrows);
});
svg.addEventListener("pointermove", e => {
  if (!draft) return;
  const p = toPitch(e); draft.x2 = p.x; draft.y2 = p.y;
  draft.node.setAttribute("x2", p.x); draft.node.setAttribute("y2", p.y);
});
svg.addEventListener("pointerup", () => {
  if (!draft) return;
  const { node, ...a } = draft; draft = null;
  if (Math.hypot(a.x2 - a.x1, a.y2 - a.y1) > 2) state.arrows.push(a);
  render();
});

function select(id) {
  selected = id; render();
  const p = findPlayer(id); if (!p) return;
  document.getElementById("editor").hidden = false;
  document.getElementById("ed-num").value = p.num;
  document.getElementById("ed-pos").value = p.pos;
  document.getElementById("ed-name").value = p.name;
  document.getElementById("ed-name").focus();
}
function findPlayer(id) { return [...state.home.players, ...state.away.players].find(p => p.id === id); }
for (const [field, key] of [["ed-num","num"],["ed-pos","pos"],["ed-name","name"]]) {
  document.getElementById(field).addEventListener("input", e => {
    const p = findPlayer(selected); if (!p) return;
    p[key] = key === "pos" ? e.target.value.toUpperCase() : e.target.value; render();
  });
}

function renderSide() {
  const r = document.getElementById("roster"); r.replaceChildren();
  for (const p of state.home.players) {
    const d = document.createElement("div"); if (p.id === selected) d.className = "sel";
    d.innerHTML = `<span class="num"></span><span class="nm"></span><span class="pos"></span>`;
    d.querySelector(".num").textContent = p.num;
    d.querySelector(".nm").textContent = p.name || "—";
    d.querySelector(".pos").textContent = p.pos;
    d.addEventListener("click", () => select(p.id));
    r.appendChild(d);
  }
  if (!selected) document.getElementById("editor").hidden = true;
  document.getElementById("summary").textContent =
    `${state.home.name} ${state.home.formation}` + (state.showAway ? `  vs  ${state.away.name} ${state.away.formation}` : "");
  document.getElementById("home-formation").value = state.home.formation;
  document.getElementById("away-formation").value = state.away.formation;
  document.getElementById("home-name").value = state.home.name;
  document.getElementById("away-name").value = state.away.name;
  document.getElementById("toggle-away").setAttribute("aria-pressed", state.showAway);
  document.getElementById("toggle-ball").setAttribute("aria-pressed", state.showBall);
}

// Controls
for (const side of ["home","away"]) {
  const s = document.getElementById(side + "-formation");
  for (const f of Object.keys(FORMATIONS)) s.add(new Option(f, f));
  s.addEventListener("change", e => applyFormation(side, e.target.value));
  document.getElementById(side + "-name").addEventListener("input", e => { state[side].name = e.target.value; renderSide(); });
}
const tools = { move: "tool-move", pass: "tool-pass", run: "tool-run" };
for (const [t, id] of Object.entries(tools)) document.getElementById(id).addEventListener("click", () => {
  tool = t; for (const [t2, id2] of Object.entries(tools)) document.getElementById(id2).setAttribute("aria-pressed", t === t2);
  svg.style.cursor = t === "move" ? "" : "crosshair";
});
document.getElementById("undo-arrow").onclick = () => { state.arrows.pop(); render(); };
document.getElementById("clear-arrows").onclick = () => { state.arrows = []; render(); };
document.getElementById("toggle-away").onclick = () => { state.showAway = !state.showAway; render(); };
document.getElementById("toggle-ball").onclick = () => { state.showBall = !state.showBall; render(); };
document.getElementById("reset").onclick = () => { state = freshState(); selected = null; render(); toast("Board reset"); };
document.getElementById("save").onclick = () => {
  try { localStorage.setItem("tactics-board", JSON.stringify(state)); toast("Saved in this browser"); }
  catch { toast("Saving isn't available here"); }
};
document.getElementById("load").onclick = () => {
  try { const s = JSON.parse(localStorage.getItem("tactics-board")); if (s) { state = s; selected = null; render(); toast("Loaded"); } else toast("Nothing saved yet"); }
  catch { toast("Loading isn't available here"); }
};
document.getElementById("copy").onclick = async () => {
  const t = state.home;
  const text = `${t.name} (${t.formation})\n` + t.players.map(p => `${p.num.padStart(2)}  ${p.pos.padEnd(4)} ${p.name}`).join("\n");
  try { await navigator.clipboard.writeText(text); toast("Line-up copied"); } catch { toast("Copy was blocked by the browser"); }
};
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

state = freshState();
render();
</script>
</body>
</html>
